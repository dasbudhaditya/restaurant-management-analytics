<body>
  <iframe id="demo" src="index.html" title="Restaurant Management Analytics Portfolio Demo"></iframe>
  <script>
    (function(){
      const DEFAULT_DEMO_DATE='2026-08-07';
      const frame=document.getElementById('demo');

      function initialiseRecruiterView(){
        let w,d;
        try{w=frame.contentWindow;d=frame.contentDocument;}catch(e){return false;}
        if(!w||!d||typeof w.loadDashboard!=='function')return false;
        const dash=d.getElementById('dashDate');
        if(!dash)return false;

        ['dashDate','dailyDate','prodDate','staffDate'].forEach(function(id){
          const el=d.getElementById(id);
          if(el)el.value=DEFAULT_DEMO_DATE;
        });
        try{if(typeof w.syncBusinessDate==='function')w.syncBusinessDate(DEFAULT_DEMO_DATE,'dashDate');}catch(e){}
        try{w.loadDashboard();}catch(e){return false;}
        return true;
      }

      frame.addEventListener('load',function(){
        let attempts=0;
        const timer=setInterval(function(){
          attempts++;
          if(initialiseRecruiterView()||attempts>100)clearInterval(timer);
        },100);
      });
    })();
  </script>
</body>
